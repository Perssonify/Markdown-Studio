name: Uptime — markdownstudio.com

# Does the production domain serve THE EDITOR? Not "does it answer": at the
# time of the audit it answered 200 with a domain-parking page. So this checks
# for the app shell itself and for its entry script being downloadable — the
# two things a boot needs. It is expected to FAIL until the domain points at
# the Vercel project (docs/deployment.md ▸ The domain).
#
# A scheduled workflow is a stopgap, not a monitor: GitHub delays and sometimes
# skips scheduled runs and only notifies the workflow's last editor (~1,450
# runs a month at this schedule). An external uptime service should replace it
# (docs/runbooks/hosting-outage.md).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-is-served:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The app shell and its entry script are served
        env:
          SITE: https://markdownstudio.com
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 30 -o page.html -w '%{http_code}' "$SITE/")
          echo "GET $SITE/ -> HTTP $code"
          test "$code" = "200"
          grep -q '<title>Markdown Studio</title>' page.html || { echo "No Markdown Studio <title> — not the app shell." >&2; exit 1; }
          grep -q '<div id="root"></div>' page.html || { echo "No #root mount point — not the app shell." >&2; exit 1; }
          entry=$(grep -o 'src="/assets/index-[^"]*\.js"' page.html | head -n1 | cut -d'"' -f2)
          test -n "$entry" || { echo "No entry script in the shell." >&2; exit 1; }
          headers=$(curl -sS -L --max-time 30 -o /dev/null -D - "$SITE$entry")
          echo "$headers" | head -n1
          echo "$headers" | grep -qi '^content-type: .*javascript' || { echo "Entry script $entry is not served as JavaScript." >&2; exit 1; }
          echo "OK: the editor shell and $entry are served."
