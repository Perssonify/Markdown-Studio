name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the Bun that produced bun.lock. `latest` made every run a
  # different toolchain, so a Bun release could turn CI red (or green) with no
  # change in this repo. Bump it together with bun.lock.
  BUN_VERSION: "1.4.0"

# Actions are pinned to full commit SHAs (resolved from their release tags,
# noted beside each) so a moved or compromised tag cannot change what runs.
# Dependabot (.github/dependabot.yml) proposes the updates.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs once package.json has a `lint` script; a clear skip until then.
      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script in package.json — skipped."
          fi

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build (app)
        run: bun run build:app

      # The CSP in vercel.json allows the inline scripts by hash; this re-runs
      # the hash check against the BUILT index.html, which only exists now —
      # and the browser-floor check that the floor still runs before the entry
      # script, stylesheets and preloads Vite injected (A097).
      - name: Inline scripts in the built app (CSP hashes, browser floor)
        run: bunx vitest run src/__tests__/ops-vercel-headers.test.js src/__tests__/ops-browser-floor.test.js

      # What Vercel runs last: sourcemaps are built but never deployed.
      - name: Keep sourcemaps out of the deploy
        run: node scripts/strip-sourcemaps.mjs

      # The maps that symbolicate a stack from "Copy diagnostics" for this
      # exact build (hashes match a deploy built from the same commit).
      - name: Keep the sourcemaps as an artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-sourcemaps-${{ github.sha }}
          path: dist-app-sourcemaps/
          retention-days: 90
          if-no-files-found: warn

      - name: Build (library)
        run: bun run build

      # What `require("@perssonify/editor")` loads, and what a TypeScript
      # consumer's compiler reads. Nothing else in CI touches the CommonJS build
      # or the declarations; the first once could not be required at all, and
      # the second failed a consumer with `skipLibCheck: false` (A113).
      - name: The built CommonJS entries load; a consumer type-checks against the declarations
        run: bunx vitest run src/__tests__/pkg-cjs-require.test.js src/__tests__/pkg-declarations.test.js

      - name: Build (embed)
        run: bun run build:embed

  # React 18 is still inside the published peer range (^18.3.0 || ^19.0.0),
  # but the repo develops on React 19, so nothing else in CI runs on 18. This
  # job swaps React 18 and its types in — after the frozen install, in this job
  # only; the changed manifest and lockfile are thrown away with the runner —
  # and runs the type gate and the unit suite against them. It is how a
  # library consumer still on 18 stays tested (A113).
  react18:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Swap in React 18
        run: bun add -d react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7

      - name: Type-check (React 18 types)
        run: bunx tsc --noEmit

      - name: Test (React 18 runtime)
        run: bun run test

  # Browser campaign. Unit tests cannot reach real IME composition, real
  # IndexedDB, quota exhaustion, a second tab, a coarse pointer, a service
  # worker or an enforced CSP — every one of which has hidden a defect in this
  # codebase. See e2e/README.md.
  e2e:
    runs-on: ubuntu-latest
    # A hung browser would otherwise burn the 360-minute default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (app)
        run: bun run build:app

      - name: Build (embed)
        run: bun run build:embed

      # The library suite measures the PUBLISHED stylesheet on a host page.
      - name: Build (library)
        run: bun run build

      - name: Install Chromium
        run: bunx playwright-core install --with-deps chromium

      # First: does the rig read the panes correctly? A wrong reader makes
      # every tier below it meaningless, in either direction.
      - name: Harness self-test
        run: bun run e2e:harness

      - name: Blast radius (tier 1)
        run: bun run e2e:smoke

      - name: The surfaces nothing else opens
        run: bun run e2e:deep

      - name: Data-loss sequences in a real browser
        run: bun run e2e:dataloss

      # Below the browser floor: a message, no app code, nothing touched.
      - name: Browser floor
        run: node e2e/run.mjs floor

      - name: Published library on a host page
        run: bun run e2e:library

      - name: Embed host bridge
        run: bun run e2e:bridge

      - name: User simulation (tier 3)
        run: bun run e2e:journeys

      - name: Fault injection (tier 4)
        run: bun run e2e:faults

      # vercel.json's Content-Security-Policy, ENFORCED, against every
      # renderer: it ships report-only, and this is what says it is safe to
      # promote.
      - name: Content-Security-Policy, enforced
        run: node e2e/run.mjs csp

      # Offline after one visit, and updates that never force-reload a tab.
      - name: Service worker (offline + updates)
        run: node e2e/run.mjs pwa

      # Tier 2 runs on a schedule rather than per-PR: it is minutes of
      # sustained typing and a 120-document library.
      - name: Stress (tier 2)
        if: github.event_name == 'push'
        run: bun run e2e:stress

      # A red run should hand you something to debug from. Without this the
      # only evidence a failure leaves is the PASS/FAIL lines in the log.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure
          if-no-files-found: ignore
          retention-days: 7
          path: |
            e2e/*.json
            e2e/artifacts/**

  # The same app on Firefox and WebKit (A100). The suites that are
  # engine-neutral run again here — the ones e2e/run.mjs lists for all three
  # engines. A check that needs Chromium's DevTools protocol (real IME
  # composition, CPU throttling) or a Chromium-only API reports SKIP with its
  # reason, and a check that fails for a REPORTED app defect reports XFAIL;
  # neither is ever counted as a pass.
  e2e-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (app)
        run: bun run build:app

      - name: Build (embed)
        run: bun run build:embed

      - name: Install ${{ matrix.engine }}
        run: bunx playwright-core install --with-deps ${{ matrix.engine }}

      - name: Harness self-test
        run: node e2e/run.mjs harness

      - name: Blast radius (tier 1)
        run: node e2e/run.mjs surfaces

      - name: The surfaces nothing else opens
        run: node e2e/run.mjs surfaces-deep

      - name: Data-loss sequences in a real browser
        run: node e2e/run.mjs dataloss

      - name: Browser floor
        run: node e2e/run.mjs floor

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-${{ matrix.engine }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            e2e/*.json
            e2e/artifacts/**
