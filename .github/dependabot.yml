version: 2
updates:
  # The JavaScript dependencies. The `bun` ecosystem, not `npm`: the lockfile is
  # bun.lock, and an npm-ecosystem PR would change package.json without it —
  # which `bun install --frozen-lockfile` (CI and Vercel) then rejects.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps; majors stay separate so each is reviewed.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The workflow actions, which are pinned to commit SHAs (Dependabot updates
  # the SHA and the version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
