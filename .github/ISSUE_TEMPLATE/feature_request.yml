name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Markdown Studio keeps documents in the browser first: the editor works
        offline and runs with no backend at all, and the hosted app adds Google
        sign-in and cloud sync on top. Proposals that only work with a server
        are harder to land — please say how yours behaves in the editor on its
        own, with no account.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing features, other editors, workarounds — and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Editing and formatting
        - Markdown parsing / round-trip fidelity
        - Library, folders, organization
        - Wiki links, backlinks, relationship map
        - Import / export
        - Appearance and typography
        - Keyboard shortcuts
        - The embed or the npm package
        - Something else
    validations:
      required: true
