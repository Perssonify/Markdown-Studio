<!DOCTYPE html>
<!-- `pf-app` opts this page in to the app-level styling (body typography and
     background, html scrollbars, the in-app-webview pins). Those rules are scoped
     to this class so that importing the library stylesheet cannot repaint a
     consumer's whole page. -->
<html lang="en" class="pf-app">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- No Referer on requests made FROM the embed (remote images in a
         document). document.referrer — how the embed learns its parent's
         origin — is set by the framing page's policy, so it is unaffected. -->
    <meta name="referrer" content="no-referrer" />
        <script>
        // Pre-paint theme + palette. next-themes only applies `.dark` in a
        // post-mount effect, so without this the browser painted the LIGHT
        // default first: measured 183ms of full-viewport cream on desktop and
        // 895ms on a throttled mid-range phone before the dark theme landed.
        // Must stay BLOCKING and above the stylesheet.
        (function () {
            try {
                // `?theme=` WINS over the stored preference. The editor's theme
                // provider writes a namespaced attribute now (so that mounting the
                // editor as a library component cannot rewrite a host page's
                // class), which means it no longer clears a wrong class this
                // script may have set — an embed asked for ?theme=light would
                // otherwise keep the pre-painted `dark` and render dark forever.
                var q = "";
                try { q = new URLSearchParams(location.search).get("theme") || ""; } catch (e) { }
                var t = q || localStorage.getItem("perssonify-theme") || "dark";
                var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                var r = document.documentElement;
                r.classList.add(d ? "dark" : "light");
                r.style.colorScheme = d ? "dark" : "light";
                var p = localStorage.getItem("perssonify-palette");
                if (p) r.setAttribute("data-palette", p);
            } catch (e) { }
        })();
    </script>
<title>Markdown Studio (embed)</title>
    <script>
        // Browser floor (A097). The stylesheet is built on @property and
        // color-mix() (Tailwind v4) and the code on regex lookbehind, so the
        // oldest browsers that can run the editor are Safari/iOS 16.4, Chrome
        // and Edge 111 and Firefox 128. Below that the page was blank (the CSS
        // does not apply) or the bundle died on a SyntaxError, which the app's
        // boot watchdog took for a broken deploy and "repaired" by deleting the
        // offline caches and reloading into the same blank page.
        // Detected by feature, never by user agent. Below the floor this
        // writes a self-contained message followed by <plaintext>, which turns
        // the REST of the page into inert text: nothing after this script is
        // parsed (the boot watchdog, the stylesheet, the module script), so no
        // editor code runs and nothing stored in this browser is touched.
        // index.html and embed.html carry this script byte for byte.
        // ES5 on purpose: it has to parse in the browsers it turns away.
        (function () {
            var ok = false;
            try {
                ok = typeof CSS !== "undefined" && typeof CSS.registerProperty === "function" &&
                    CSS.supports("color", "color-mix(in srgb, red, red)") &&
                    new RegExp("(?<=a)b").test("ab");
            } catch (e) { }
            if (ok) return;
            window.__PF_UNSUPPORTED = true;
            document.write(
                '<main style="display:block;box-sizing:border-box;max-width:36rem;margin:12vh auto 0;padding:0 24px;' +
                'font:16px/1.55 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,system-ui,sans-serif">' +
                '<h1 style="font-size:22px;line-height:1.3;margin:0 0 12px">Markdown Studio needs a newer browser</h1>' +
                '<p style="margin:0 0 8px">This browser is missing features the editor is built on. It runs in:</p>' +
                '<ul style="margin:0 0 16px;padding-left:22px">' +
                '<li>Safari 16.4 or later, and on iPhone and iPad iOS or iPadOS 16.4 or later (every browser there uses Safari\'s engine)</li>' +
                '<li>Chrome or Microsoft Edge 111 or later</li>' +
                '<li>Firefox 128 or later</li>' +
                '</ul>' +
                '<p style="margin:0">Nothing has been deleted. Documents you saved in this browser are untouched and stay on this device; they will be there when you open Markdown Studio again after updating.</p>' +
                '</main><plaintext style="display:none">'
            );
        })();
    </script>
</head>

<body class="pf-app">
    <div id="root"></div>
    <script type="module" src="/src/embed.tsx"></script>
</body>

</html>
