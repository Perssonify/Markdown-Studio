<!DOCTYPE html>
<!-- `pf-app` opts this page in to the app-level styling (body typography and
     background, html scrollbars, the in-app-webview pins). Those rules are scoped
     to this class so that importing the library stylesheet cannot repaint a
     consumer's whole page. -->
<html lang="en" class="pf-app">

<head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the chrome can dodge
         notches / home indicators in full-screen in-app webviews (WhatsApp, Slack,
         Telegram, Claude, ChatGPT). interactive-widget=resizes-content shrinks the
         layout when the on-screen keyboard opens instead of letting it cover the
         editor. No maximum-scale — pinch-zoom stays available for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <script>
        // Pre-paint theme + palette. next-themes only applies `.dark` in a
        // post-mount effect, so without this the browser painted the LIGHT
        // default first: measured 183ms of full-viewport cream on desktop and
        // 895ms on a throttled mid-range phone before the dark theme landed.
        // Must stay BLOCKING and above the stylesheet.
        (function () {
            try {
                var t = localStorage.getItem("perssonify-theme") || "system";
                var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                var r = document.documentElement;
                r.classList.add(d ? "dark" : "light");
                r.style.colorScheme = d ? "dark" : "light";
                var p = localStorage.getItem("perssonify-palette");
                if (p) r.setAttribute("data-palette", p);
            } catch (e) { }
        })();
    </script>
<title>Markdown Studio</title>
    <script>
        // Boot watchdog — self-heals a load that can never boot. Classic cause:
        // a stale service worker or cache serving HTML whose hashed entry
        // script no longer exists on the current deploy → a hard blank page with
        // no error hook. Recovery = unregister every service worker, drop all
        // caches, note why (the app reads pf:boot-recovered into its diagnostics)
        // and reload once. Inline so it works even when NO bundle loads.
        //
        // It acts only on EVIDENCE and only ONLINE. It used to fire on a timer
        // alone (8s), so a slow phone — the startup bundle does not load in 8s
        // on slow 3G — lost its offline cache and was reloaded, and offline it
        // then landed on the browser's error page: the caches it deleted were
        // the only copy of the app there was. Evidence is a <script> or <link>
        // that failed to load (a 404, or HTML served where a module was
        // expected) or an uncaught error before the app booted; the grace period
        // lets a non-fatal failure (a stylesheet) finish booting anyway.
        // A sessionStorage stamp prevents any reload loop.
        (function () {
            var KEY = "pf:boot-recover-at";
            var GRACE_MS = 4000;
            var failed = "";
            var timer = 0;
            function check() {
                timer = 0;
                if (window.__PF_BOOTED || !failed) return;
                if (navigator.onLine === false) return; // retried on "online"
                var last = 0;
                try { last = Number(sessionStorage.getItem(KEY) || "0"); } catch (e) { }
                if (Date.now() - last < 30000) return; // recovered recently — don't loop
                try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) { return; }
                try { localStorage.setItem("pf:boot-recovered", JSON.stringify({ t: Date.now(), reason: failed })); } catch (e) { }
                var cleanup = [];
                try {
                    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                        cleanup.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                            return Promise.all(rs.map(function (r) { return r.unregister(); }));
                        }));
                    }
                    if (window.caches && window.caches.keys) {
                        cleanup.push(window.caches.keys().then(function (ks) {
                            return Promise.all(ks.map(function (k) { return window.caches.delete(k); }));
                        }));
                    }
                } catch (e) { }
                Promise.all(cleanup).catch(function () { }).then(function () {
                    location.reload();
                });
            }
            window.addEventListener("error", function (e) {
                if (window.__PF_BOOTED || failed) return;
                var t = e && e.target;
                if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) failed = "failed-to-load:" + t.tagName.toLowerCase();
                else if (e && (e.error || e.message)) failed = "boot-error";
                else return;
                if (!timer) timer = setTimeout(check, GRACE_MS);
            }, true);
            window.addEventListener("online", check);
        })();
    </script>
</head>

<body class="pf-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
